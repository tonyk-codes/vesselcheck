<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="查詢香港海事處船隻抵港、離港及未來船期資料">
  <meta name="theme-color" content="#f6fbfd">
  <title>海事處船隻進出港資料查詢</title>
  <link rel="preconnect" href="https://www.mardep.gov.hk">
  <link rel="stylesheet" href="styles.css?v=20260728-6">
  <script defer src="app.js?v=20260728-6"></script>
</head>
<body>
  <a class="skip-link" href="#query">跳至查詢</a>
  <header class="site-header">
    <div class="shell header-inner">
      <div><h1>海事處船隻進出港資料查詢</h1></div>
    </div>
  </header>

  <main class="shell" id="query">
    <section class="panel query-panel" aria-labelledby="query-title">
      <div class="panel-heading"><div><h2 id="query-title">查詢選項</h2></div><p id="modeHint">可查詢最近 36 小時，或取消勾選查詢最多 20 天的歷史資料。</p></div>
      <div class="panel-body">
        <fieldset class="mode-switcher"><legend>資料時段</legend>
          <label class="mode-option"><input type="checkbox" id="useLast36h" checked><span class="check-ui"></span><span><strong>最近 36 小時數據</strong><small>已抵港及已離港紀錄</small></span></label>
          <label class="mode-option"><input type="checkbox" id="useFuture"><span class="check-ui"></span><span><strong>未來抵/離船隻</strong><small>預計抵港及離港船期</small></span></label>
        </fieldset>

        <div class="form-grid">
          <label class="field"><span>船隻名稱 <em>可選</em></span><input id="vesselName" type="search" autocomplete="off"></label>
          <label class="field"><span>開始日期</span><input id="startDate" type="date"></label>
          <label class="field"><span>結束日期</span><input id="endDate" type="date"></label>
          <label class="field"><span>資料類型</span><select id="dataType"><option value="both">抵港及離港</option><option value="arrival">僅抵港</option><option value="departure">僅離港</option></select></label>
        </div>
        <div class="actions"><button class="button primary" id="searchBtn" type="button"><span>搜尋資料</span></button><button class="button secondary" id="clearBtn" type="button">重設</button></div>
      </div>
    </section>

    <section class="panel results-panel" aria-labelledby="results-title">
      <div class="panel-heading results-heading"><div><h2 id="results-title">搜尋結果</h2></div><div id="resultMeta" class="result-meta" aria-live="polite">尚未搜尋</div></div>
      <div class="panel-body">
        <div class="message error" id="errorMessage" role="alert"></div>
        <div class="message success" id="successMessage" role="status"></div>
        <details class="log-wrap" id="logWrap"><summary>資料擷取詳情</summary><div class="log-panel" id="logPanel"></div></details>
        <div class="loading" id="loading" role="status"><div class="spinner"></div><p id="loadingText">正在獲取資料...</p><div class="progress"><i id="progressBar"></i></div></div>
        <div class="stats-row" id="stats"></div>
        <div class="no-results" id="noResults"><div>⌕</div><h3>沒有找到結果</h3><p>請嘗試調整船名、日期或資料類型。</p></div>
        <div class="table-wrapper" id="tableWrapper"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
      </div>
    </section>
  </main>

    <footer><div class="shell footer-inner"><div><strong>資料來源</strong><nav><a href="https://data.gov.hk/tc-data/dataset/hk-md-mardep-vessel-arrivals-and-departures/resource/92cf7f6f-be58-4072-84ff-3b8c612bf204" target="_blank" rel="noopener">過去三十六小時抵港的船隻</a><a href="https://data.gov.hk/tc-data/dataset/hk-md-mardep-vessel-arrivals-and-departures/resource/7cafe2bc-066f-4665-b527-d4b792f96e4a" target="_blank" rel="noopener">過去三十六小時離港的船隻</a><a href="https://data.gov.hk/tc-data/dataset/hk-md-mardep-vessel-traffic-management-system-report/resource/db2fa233-5f4f-444c-8760-8a04537e71bc" target="_blank" rel="noopener">已抵港船隻報告</a><a href="https://data.gov.hk/tc-data/dataset/hk-md-mardep-vessel-traffic-management-system-report/resource/4266274a-eb38-452a-a170-d2cc96627942" target="_blank" rel="noopener">已離港船隻報告</a><a href="https://www.mardep.gov.hk/e_files/en/pub_services/vlrtarrive.html" target="_blank" rel="noopener">將會抵港的船隻</a><a href="https://www.mardep.gov.hk/e_files/en/pub_services/vlrtdepart.html" target="_blank" rel="noopener">在未來七十二小時將會離港的船隻</a></nav></div><p><span>版本 2026.07.28.6</span></p></div></footer>
</body>
</html>
